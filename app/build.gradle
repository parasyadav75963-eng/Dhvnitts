plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.itfb.dhwanitts'
    compileSdk 34

    defaultConfig {
        applicationId "com.itfb.dhwanitts"
        minSdk 24
        targetSdk 34
        versionCode = ((System.getenv("GITHUB_RUN_NUMBER") ?: "10").toInteger() + 10)
        versionName "1.8.0"

        // NDK के लिए सिर्फ 64-bit Android (arm64) को टारगेट करना
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
            }
        }
    }

    signingConfigs {
        permanentSign {
            storeFile file("dhwanitts-Permanent.jks")
            storePassword "dhwani123"
            keyAlias "dhwanitts_key"
            keyPassword "dhwani123"
        }
    }
    signingConfigs {
        debug {
            storeFile file("dhwani.keystore")
            storePassword "dhwani123"
            keyAlias "dhwani"
            keyPassword "dhwani123"
        }
        release {
            storeFile file("dhwani.keystore")
            storePassword "dhwani123"
            keyAlias "dhwani"
            keyPassword "dhwani123"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.permanentSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Microsoft's Official ONNX Runtime C/C++ API for Android
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'
}


